[tool.poetry]
name = "ogameasure"
version = "0.6.2"
description = "Driver for SCPI device"
authors = [
    "Shota Ueda <s7u27astr0@gmail.com>",
    "Tatsumi Ishikawa <t.ishikawa@a.phys.nagoya-u.ac.jp>"
]
maintainers = ["Rin Yamada <yamada@a.phys.nagoya-u.ac.jp>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/ogawa-ros/ogameasure"

[tool.poetry.dependencies]
# Python 3.12（ROS Jazzy 前提）
python = ">=3.12,<3.13"

# Python 3.12 対応が保証される範囲
numpy = ">=1.26.4,<3.0"
pyserial = "^3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
